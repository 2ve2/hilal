name: 🐛 Bug report
description: Something doesn't work, or a date is wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. The more precise the report, the faster it gets fixed.

        **A date differs from an announced religious occasion?** Hilal follows the Umm al-Qura calendar. Occasions announced by moon sighting can differ by a day, and that is not a bug. To follow a local sighting, use the `hijriAdjustment` prop. See [Accuracy](https://github.com/2ve2/hilal#accuracy).
  - type: checkboxes
    attributes:
      label: Before submitting
      options:
        - label: I'm using the latest version of react-native-hilal.
          required: true
        - label: I searched the existing issues.
          required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: What you expected, and what happened instead. Screenshots help for UI bugs.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The props you pass to `<HilalCalendar />`, or the function call and the dates involved.
      value: |
        1.
        2.
      render: tsx
    validations:
      required: true
  - type: dropdown
    id: platforms
    attributes:
      label: Platforms
      multiple: true
      options:
        - iOS
        - Android
        - Web
        - Expo Go
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: react-native-hilal, react-native and Expo SDK (if any).
      placeholder: 'react-native-hilal 0.1.0, react-native 0.88.0, Expo SDK 58'
    validations:
      required: true
  - type: input
    id: repro
    attributes:
      label: Reproduction (optional)
      description: A link to a repository or an Expo Snack that shows the bug.
